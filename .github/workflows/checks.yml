name: Проверка frontend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Получить исходники
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Подготовить Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Установить зависимости
        run: npm ci
      - name: Проверить стиль кода
        run: npm run lint -- --max-warnings=0
      - name: Проверить TypeScript
        run: npm run typecheck
      - name: Собрать приложение
        run: npm run build

